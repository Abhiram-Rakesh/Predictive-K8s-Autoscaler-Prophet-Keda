name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test,service]"
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Run simulation (regenerates the comparison chart)
        run: python -m sim.compare
      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: comparison-chart
          path: screenshots/comparison.png

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image repo
        # Docker/GHCR require lowercase repository names; github.repository_owner
        # preserves the account's display case (e.g. "Abhiram-Rakesh"), which
        # buildx rejects outright.
        id: image
        run: |
          echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/predictive-scaler" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.repo }}:latest
            ${{ steps.image.outputs.repo }}:${{ github.sha }}
      - name: Image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo "Pinned tag for production deploys:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.image.outputs.repo }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Use \`helm upgrade --set image.tag=${{ github.sha }} ...\` to deploy." >> $GITHUB_STEP_SUMMARY
