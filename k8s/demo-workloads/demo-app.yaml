apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: default
  labels:
    app: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
    spec:
      containers:
        # nginx serves a trivial response; the exporter sidecar turns nginx
        # stub_status into the http_requests_total metric Prometheus scrapes.
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.1
          args:
            - --nginx.scrape-uri=http://localhost:80/stub_status
          ports:
            - containerPort: 9113
      volumes:
        - name: conf
          configMap:
            name: demo-app-nginx-conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-nginx-conf
  namespace: default
data:
  default.conf: |
    server {
      listen 80;
      location / { return 200 "ok\n"; }
      location /stub_status { stub_status; }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: default
  labels:
    app: demo-app
spec:
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: metrics
      port: 9113
      targetPort: 9113
