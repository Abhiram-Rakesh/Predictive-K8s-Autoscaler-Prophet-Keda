[project]
name = "predictive-autoscaler-eks"
version = "0.3.0"
description = "Prophet-driven predictive Kubernetes autoscaler on AWS EKS, with a reactive KEDA safety net."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prophet>=1.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "prometheus-api-client>=0.5",
]
test = [
    "pytest",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "sim", "service"]
